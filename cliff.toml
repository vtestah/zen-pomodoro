# git-cliff configuration — https://git-cliff.org/docs/configuration
# Drives CHANGELOG.md and version bumps for the Zen Pomodoro source repo.
# (The public Cinnamon Spices submission follows its own title convention —
# see RELEASING.md. This file is only for our own history/versioning.)

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
The format is based on [Keep a Changelog](https://keepachangelog.com),
and the project follows [Semantic Versioning](https://semver.org).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
# Keep older, non-conventional "Zen Pomodoro: ..." commits in the changelog
# instead of dropping them (they group under "Other").
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = '^feat', group = "Features" },
    { message = '^fix', group = "Bug Fixes" },
    { message = '^docs?', group = "Documentation" },
    { message = '^perf', group = "Performance" },
    { message = '^refactor', group = "Refactor" },
    { message = '^style', group = "Styling" },
    { message = '^test', group = "Testing" },
    { message = '^chore\(release\)', skip = true },
    { message = '^chore\(deps\)', skip = true },
    { message = '^(chore|ci|build)', group = "Miscellaneous" },
    { body = '.*security', group = "Security" },
    { message = '.*', group = "Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = 'v[0-9].*'
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.0.0"
# These types don't move the version on their own.
no_increment_regex = '^(chore|ci|docs)'
